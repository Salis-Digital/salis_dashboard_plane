name: Salis Prod Docker

on:
  push:
    branches:
      - salis-prod
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE_OWNER: katexx
  BUILDX_PLATFORMS: linux/amd64

jobs:
  setup:
    name: Build Setup
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - id: version
        name: Read version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "Failed to read version from package.json"
            exit 1
          fi
          echo "release_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release tag: v${VERSION}"

  build_push:
    name: Build-Push ${{ matrix.image }}
    runs-on: ubuntu-22.04
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: plane-frontend
            dockerfile: ./apps/web/Dockerfile.web
            context: .
          # - image: plane-space
          #   dockerfile: ./apps/space/Dockerfile.space
          #   context: .
          - image: plane-admin
            dockerfile: ./apps/admin/Dockerfile.admin
            context: .
          - image: plane-live
            dockerfile: ./apps/live/Dockerfile.live
            context: .
          - image: plane-backend
            dockerfile: ./apps/api/Dockerfile.api
            context: ./apps/api
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v7.0.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.BUILDX_PLATFORMS }}
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_OWNER }}/${{ matrix.image }}:${{ needs.setup.outputs.release_tag }}
            ${{ env.DOCKER_IMAGE_OWNER }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
